async function api(path,{method='GET',body,raw=false}={}){

 if(S.csrf&&method!=='GET')headers['X-CSRF-Token']=S.csrf;
 let response;try{response=await fetch('/api'+path,{method,credentials:'same-origin',headers,body:body instanceof FormData?body:body!==undefined?JSON.stringify(body):undefined})}catch(e){throw new Error('No hay conexión con el servidor. Tus cambios pendientes permanecen en pantalla.')}
 if(!response.ok){let data;try{data=await response.json()}catch(e){data={detail:'El servidor no pudo completar la operación.'}}
  const error=new Error(typeof data.detail==='string'?data.detail:'Revisa los campos enviados.');error.status=response.status;
  if(response.status===401&&!path.startsWith('/auth/')){S.user=null;clearTimeout(S.timer);renderAuth('login');toast('La sesión ha expirado. Inicia sesión nuevamente.',true)}throw error;
 }

function apuRows(){return S.apuDraft.resources.length?S.apuDraft.resources.map((r,i)=>`<div class="apu-row"><div class="field"><label>Descripción</label><input class="control" data-apu-row="${i}" data-apu-resource="description" value="${E(r.description)}" required maxlength="500"></div><div class="field"><label>Categoría</label><select class="control" data-apu-row="${i}" data-apu-resource="category">${opts([['material','Material'],['labor','Mano de obra'],['equipment','Equipo'],['transport','Transporte']],r.category)}</select></div><div class="field"><label>Unidad</label><input class="control" data-apu-row="${i}" data-apu-resource="unit" value="${E(r.unit)}" required></div><div class="field"><label>Método</label><select class="control" data-apu-row="${i}" data-apu-resource="mode">${opts([['consumption','Consumo'],['crew','Cuadrilla'],...(r.category==='equipment'?[['percent','Porcentaje']]:[])],r.mode)}</select>${r.mode==='percent'?`<select class="control" data-apu-row="${i}" data-apu-resource="base" aria-label="Base del porcentaje">${opts([['labor','Mano de obra'],['direct','Directo sin %']],r.base||'labor')}</select>`:''}</div><div class="field"><label>Cantidad / %</label><input class="control num" type="number" min="0" step="any" data-apu-row="${i}" data-apu-resource="quantity" value="${E(r.quantity)}" required></div><div class="field"><label>Tarifa / unidad</label><input class="control num" type="number" min="0" step="any" data-apu-row="${i}" data-apu-resource="price" value="${E(r.price)}" ${r.mode==='percent'?'readonly':''} required></div><div class="field"><label>Desp. %</label><input class="control num" type="number" min="0" max="1000" step="any" data-apu-row="${i}" data-apu-resource="waste" value="${E(r.waste||0)}" required></div>${IB('trash','Eliminar recurso','apu-remove',`data-index="${i}"`,'danger')}</div>`).join(''):empty('Define los recursos del rubro','Agrega insumos desde el catálogo o crea recursos manuales.')}
async function updateApuCalc(){clearTimeout(apuTimer);apuTimer=setTimeout(async()=>{if(!$('#apu-calculation'))return;try{const c=await api('/apu/calculate',{method:'POST',body:S.apuDraft});if($('#apu-calculation'))$('#apu-calculation').innerHTML=`<div class="metrics-mini"><div class="card metric-mini"><span class="tiny muted">Costo directo</span><strong>${money(c.direct,4)}</strong></div><div class="card metric-mini"><span class="tiny muted">Indirectos + utilidad</span><strong>${money(+c.indirect_amount+ +c.profit_amount,4)}</strong></div><div class="card metric-mini"><span class="tiny muted">Precio unitario</span><strong class="orange">${money(c.unitPrice,4)}</strong></div></div>`}catch(e){if($('#apu-calculation'))$('#apu-calculation').innerHTML=notice(E(e.message),'blue')}},300)}

function renderSettings(){const c=S.company,sys=S.system;return heading('Configuración de la empresa','Tu identidad, tus documentos y tus datos, bajo tu control.','','ADMINISTRACIÓN')+
 `<div class="settings-grid"><div class="stack"><section class="card"><div class="card-head"><div><h2>Identidad corporativa</h2><p>Elementos visuales de tus proformas y presupuestos</p></div></div><div class="card-body"><div class="brand-assets">${[['logo','Logo','building'],['stamp','Sello','stamp'],['signature','Firma autorizada','signature']].map(([key,title,ic])=>`<div class="brand-asset"><div class="asset-image">${c[key+'_id']||key==='logo'?`<img src="${c[key+'_id']?fileURL(c[key+'_id']):asset('logo.png')}" alt="${title}">`:I(ic)}</div><strong>${title}</strong>${B('Cambiar','upload-file','upload','sm',`data-purpose="${key}"`)}</div>`).join('')}</div><p class="tiny muted mt16">Sello y firma se insertan como imágenes. No sustituyen una firma electrónica con certificado.</p></div></section><form id="company-form" class="stack"><section class="card"><div class="card-head"><h2>Información comercial</h2></div><div class="card-body"><div class="form-grid">${input('Nombre comercial *','name',c.name,'text','required maxlength="500"')}${input('RUC','ruc',c.ruc,'text','maxlength="30"')}${input('Teléfono','phone',c.phone,'text','maxlength="80"')}${input('Correo','email',c.email,'email','maxlength="254"')}${input('Dirección','address',c.address,'text','maxlength="500"')}${input('Ciudad','city',c.city,'text','maxlength="100"')}${input('Lema de empresa','tagline',c.tagline,'text','maxlength="500"')}${input('Firma autorizada · nombre','authorized',c.authorized,'text','maxlength="500"')}${input('Sitio web','website',c.website,'url','placeholder="https://…"')}${input('Instagram','instagram',c.instagram,'url','placeholder="https://…"')}${input('Facebook','facebook',c.facebook,'url','placeholder="https://…"')}</div></div></section><section class="card"><div class="card-head"><h2>Valores de los documentos</h2></div><div class="card-body"><div class="form-grid">${input('IVA inicial (%) · verificar tasa','default_vat',c.default_vat,'number','min="0" max="100" step="any" required')}${input('Vigencia inicial (días)','valid_days',c.valid_days,'number','min="1" max="3650" step="1" required')}${area('Condiciones comerciales por defecto','terms',c.terms,'maxlength="6000"')}${input('Pie de página','footer',c.footer,'text','maxlength="500"')}</div><div class="mt20">${notice('El sistema no fija una tasa legal por país o por fecha. La configuración inicial de IVA es 0 %; verifica la tasa de cada operación. Los cambios no modifican documentos emitidos.','blue')}</div></div></section><div class="flex" style="justify-content:flex-end"><button class="btn primary" type="submit">${I('save')}Guardar configuración</button></div></form></div><aside class="settings-aside stack"><section class="card"><div class="card-head"><h2>Estado de los servicios</h2>${I('cloud','sm')}</div><div class="card-body">${[['Base de datos',sys.database],['Archivos',sys.storage],['Correo SMTP',sys.smtp?'Configurado':'Pendiente de configurar'],['Entorno',sys.production?'Producción · HTTPS':'Desarrollo / prueba'],['Respaldo automático','Cada '+sys.backup_hours+' horas'],['Retención',sys.backup_keep+' respaldos']].map(([a,b])=>`<div class="system-row"><span>${a}</span><b>${E(b)}</b></div>`).join('')}<p class="tiny muted mt16">SMTP, almacenamiento S3 y dominio público se configuran mediante variables de entorno del servidor. No se guardan credenciales en esta pantalla.</p></div></section><section class="card"><div class="card-head"><h2>Copias de seguridad</h2>${I('shield','sm')}</div><div class="card-body"><p class="small muted mb16">Base SQL y archivos adjuntos en un ZIP. Conserva una copia protegida fuera del servidor.</p>${B('Crear y descargar respaldo','backup','download','primary wide')}<div class="mt16">${sys.backups.slice(0,4).map(b=>`<div class="backup-row">${I('database')}<div class="grow">${E(b.name)}<small>${(b.size/1024/1024).toFixed(2)} MB</small></div>${IB('download','Descargar respaldo','download-backup',`data-name="${E(b.name)}"`)}</div>`).join('')||'<p class="tiny muted">Aún no hay copias completas.</p>'}</div></div></section><section class="card"><div class="card-head"><h2>Trae tus datos anteriores</h2></div><div class="card-body"><p class="small muted mb16">Importa un respaldo JSON de GLEDITECH APU v1. Los códigos existentes se conservan.</p>${B('Importar respaldo APU','legacy-import','upload','wide')}<p class="tiny muted mt12">Insumos, APU, proyectos y presupuestos. El HTML original permanece en la carpeta legacy del proyecto.</p></div></section><section class="card"><div class="card-head"><h2>Datos de ejemplo</h2></div><div class="card-body"><p class="small muted mb16">Retira los registros ilustrativos antes de comenzar con tus datos reales. Los datos vinculados a registros reales pueden impedir su eliminación.</p>${B('Eliminar ejemplos','clear-demo','trash','sm danger')}</div></section></aside></div>`}
function renderUsers(){return heading('Usuarios y permisos','Accesos definidos. Responsabilidades claras.',B('Nuevo usuario','new-user','plus','primary'),'ADMINISTRACIÓN')+`<div class="card"><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Seguridad</th><th></th></tr></thead><tbody>${S.users.map(u=>`<tr><td><div class="title-cell"><span class="avatar">${E(u.name.split(' ').slice(0,2).map(w=>w[0]).join(''))}</span><div><b>${E(u.name)}</b><div class="detail">${E(u.username)}</div></div></div></td><td>${E(u.email||'No registrado')}</td><td><span class="badge">${u.role==='admin'?'Administrador':'Técnico'}</span></td><td>${pill(u.active?'En ejecución':'Suspendido').replace('En ejecución','Activo').replace('Suspendido','Inactivo')}</td><td class="small muted">${u.must_change?'Cambio de clave obligatorio':'Contraseña actualizada'}</td><td>${IB('edit','Editar usuario','edit-user',`data-id="${u.id}"`)}</td></tr>`).join('')}</tbody></table></div></div><div class="detail-grid mt20"><div class="notice blue">${I('shield')}<div><b>Administrador</b><br>Gestiona usuarios, clientes, proyectos, precios, documentos, reportes, auditoría y configuración.</div></div><div class="notice blue">${I('tool')}<div><b>Técnico</b><br>Consulta proyectos, clientes y precios. Crea y modifica sus propios presupuestos y proformas. Puede subir evidencia y documentos, sin administrar usuarios ni reportes financieros.</div></div></div>`}
function userModal(id=''){const u=id?S.users.find(x=>x.id===id):{};modal(id?'Editar usuario':'Nuevo usuario','Las contraseñas temporales deben cambiarse en el primer acceso.',`<div class="form-grid">${input('Usuario *','username',u.username||'','text',`required minlength="3" maxlength="80" ${id?'readonly':''}`)}${input('Nombre *','name',u.name||'','text','required maxlength="160"')}${input('Correo de recuperación','email',u.email||'','email','maxlength="254"')}${select('Rol','role',[['admin','Administrador'],['technician','Técnico']],u.role||'technician')}${input(id?'Nueva contraseña (opcional)':'Contraseña temporal *','password','','password',`minlength="12" maxlength="128" autocomplete="new-password" ${id?'':'required'}`)}<div class="field" style="justify-content:center">${check('Cuenta activa','active',id?!!u.active:true)}</div></div>`,{save:id?'Guardar cambios':'Crear usuario',submit:async form=>{await api('/users'+(id?'/'+id:''),{method:id?'PUT':'POST',body:formValues(form)});closeModal(true);toast('Usuario guardado.');await route()}})}
function renderAudit(){return heading('Registro de actividad','Trazabilidad de accesos y operaciones realizadas.','','CONTROL Y SEGURIDAD')+`<div class="toolbar">${searchField('Buscar usuario, acción o detalle…','','audit-search')}<div class="flex">${B('Anteriores','audit-prev','back','sm')}${B('Siguientes','audit-next','arrow','sm')}<span class="badge">Desde ${S.auditOffset+1}</span></div></div><div class="card" id="audit-results">${auditRows()}</div>`}
function auditRows(){return `<div class="table-wrap"><table><thead><tr><th>Fecha / hora</th><th>Usuario</th><th>Acción</th><th>Módulo</th><th>Detalle</th><th>IP</th></tr></thead><tbody>${S.audit.map(a=>`<tr><td style="white-space:nowrap">${new Date(a.created_at).toLocaleString('es-EC')}</td><td>${E(a.username)}</td><td><span class="badge">${E(a.action.replaceAll('_',' '))}</span></td><td>${E(a.entity)}</td><td style="max-width:350px;overflow-wrap:anywhere">${E(a.details||'—')}</td><td class="tiny muted">${E(a.ip||'Sistema')}</td></tr>`).join('')||'<tr><td colspan="6">No se encontraron actividades.</td></tr>'}</tbody></table></div>`}
function renderAuth(mode='login'){
 $('#dialog').open&&$('#dialog').close();document.body.classList.remove('menu-open');
 const title=mode==='forgot'?'Recupera tu acceso.':mode==='reset'?'Una nueva contraseña.':'Bienvenido de nuevo.';
 const desc=mode==='forgot'?'Escribe el correo asociado a tu usuario.':mode==='reset'?'Elige una contraseña de al menos 12 caracteres.':'Accede a tu espacio de trabajo y sigue construyendo.';
 $('#app').innerHTML=`<div class="auth"><section class="auth-visual"><img class="auth-image" src="${asset('obra.jpg')}" alt=""><div class="brand"><img src="${asset('logo.png')}" alt="Logo GLEDITECH"><div><strong>GLEDITECH</strong><small>INGENIERÍA CIVIL Y ELÉCTRICA</small></div></div><div class="auth-copy"><div class="eyebrow">DEL PLANO A LA REALIDAD</div><h2>Diseñamos proyectos.<br><span>Construimos confianza.</span></h2><p>Controla tus costos, organiza tus obras y transforma cada propuesta en una nueva oportunidad.</p></div><div class="auth-specialties"><span class="flex gap8">${I('building')}Ingeniería civil</span><span class="flex gap8">${I('bolt')}Ingeniería eléctrica</span></div></section><section class="auth-form-wrap"><div class="auth-panel"><img class="mini-logo" src="${asset('logo.png')}" alt="GLEDITECH"><div class="eyebrow">SISTEMA INTEGRAL DE PRESUPUESTOS Y PROFORMAS</div><h1>${title}</h1><p>${desc}</p><form id="auth-form" data-mode="${mode}"><div id="form-error" hidden></div>${mode==='login'?input('Usuario','username','','text','required autocomplete="username" maxlength="80"')+input('Contraseña','password','','password','required autocomplete="current-password" maxlength="128"'):mode==='forgot'?input('Correo de recuperación','email','','email','required autocomplete="email"'):input('Nueva contraseña','new_password','','password','required minlength="12" maxlength="128" autocomplete="new-password"')+input('Confirmar contraseña','confirm_password','','password','required minlength="12" maxlength="128" autocomplete="new-password"')}${mode==='login'?'<div class="right mt16"><button class="link small" type="button" data-act="forgot-password">¿Olvidaste tu contraseña?</button></div>':''}<button class="btn primary wide" type="submit">${mode==='login'?'Ingresar al sistema':mode==='forgot'?'Enviar instrucciones':'Guardar contraseña'}${I('arrow')}</button></form><div class="auth-help">${mode!=='login'?'<button class="link" data-act="back-login">Volver al inicio de sesión</button>':'Acceso exclusivo para el equipo autorizado de GLEDITECH.'}</div><div class="secure-note">${I('shield')}Tu próximo gran proyecto empieza con una buena gestión.</div></div></section></div>`;
 setTimeout(()=>$('#auth-form input')?.focus(),80);
}
function passwordModal(required=false){modal(required?'Protege tu primer acceso':'Cambiar contraseña',required?'La clave inicial no debe utilizarse para trabajar. Configura tu contraseña personal.':'Se cerrarán las demás sesiones al guardar la nueva contraseña.',`<div class="form-grid">${input('Contraseña actual','current_password','','password','required autocomplete="current-password" maxlength="128"')}${input('Nueva contraseña','new_password','','password','required minlength="12" maxlength="128" autocomplete="new-password"')}${input('Confirmar nueva contraseña','confirm_password','','password','required minlength="12" maxlength="128" autocomplete="new-password"')}</div><div class="mt20">${notice('Utiliza al menos 12 caracteres. Puedes usar una frase larga y fácil de recordar. No reutilices la contraseña de otro servicio.','blue')}</div>`,{noCancel:required,save:'Actualizar contraseña',submit:async form=>{const v=formValues(form);if(v.new_password!==v.confirm_password)throw new Error('Las contraseñas no coinciden.');const r=await api('/auth/password',{method:'POST',body:v});S.user=r.user;S.csrf=r.csrf||S.csrf;closeModal(true);await preload();if(!location.hash||location.hash.startsWith('#token'))location.hash='#dashboard';await route();toast('Contraseña actualizada. Bienvenido a tu espacio de trabajo.') }})}
async function profileModal(){const sessions=await api('/auth/sessions');modal('Tu cuenta',S.user.name+' · '+(isAdmin()?'Administrador':'Técnico'),`<div class="profile-menu"><button data-act="change-password">${I('lock')}Cambiar contraseña${I('chevron','sm')}</button><button data-act="revoke-sessions">${I('shield')}Cerrar otras sesiones${I('chevron','sm')}</button><button data-act="logout">${I('logout')}Cerrar sesión${I('chevron','sm')}</button></div><h3 class="mt24 mb16">Sesiones activas</h3>${sessions.map(s=>`<div class="flex between small mb16"><div>${s.current?'Este dispositivo':'Otra sesión'}<div class="tiny muted">Último uso: ${new Date(s.last_seen*1000).toLocaleString('es-EC')}</div></div>${s.current?'<span class="pill green">Actual</span>':''}</div>`).join('')}`)}
function searchModal(){modal('Busca en tu espacio de trabajo','Proyectos, clientes, precios y documentos.',searchField('Escribe al menos 2 caracteres…','','global-query')+'<div id="global-results" class="mt16">'+empty('Encuentra el siguiente paso','Busca por nombre o descripción.')+'</div>',{wide:true})}
function notificationsModal(){modal('Notificaciones','Novedades y eventos de tu espacio de trabajo.',S.notifications.length?S.notifications.map(n=>`<button class="search-result" data-act="notification-go" data-page="${E(n.link||'dashboard')}"><span class="symbol ${n.is_read?'':'orange'}">${I('bell')}</span><span class="grow"><strong>${E(n.title)}</strong><small>${E(n.message)}</small><small>${dateLabel(n.created_at)}</small></span>${!n.is_read?'<span class="legend-dot"></span>':''}</button>`).join(''):empty('Todo al día','No hay notificaciones pendientes.'),{footer:B('Marcar como leídas','read-notifications','check','primary sm')})}
function legacyModal(){modal('Importar desde GLEDITECH APU','Abre el HTML anterior y descarga su respaldo JSON antes de continuar.',`<div class="drop-zone">${I('database')}<strong>Respaldo GLEDITECH_APU · versión 1</strong><p>Se importan insumos, APU, clientes, proyectos y presupuestos.<br>El archivo original no se modifica.</p><input name="file" type="file" accept=".json" required aria-label="Seleccionar respaldo JSON"></div><div class="mt20">${notice('Los códigos existentes se omiten. Los capítulos del presupuesto anterior se conservan como prefijo de cada descripción. La operación completa se revierte si hay un error.','blue')}</div>`,{save:'Importar respaldo',submit:async form=>{const fd=new FormData();fd.append('file',form.elements.file.files[0]);const r=await api('/import/legacy',{method:'POST',body:fd});closeModal(true);await preload();await route();toast(`${r.prices} precios · ${r.projects} proyectos · ${r.budgets} presupuestos importados. ${r.skipped} códigos conservados.`)}})}
const actions={
 'navigate':b=>go(b.dataset.page),
 'toggle-menu':()=>document.body.classList.toggle('menu-open'),
 'close-menu':()=>document.body.classList.remove('menu-open'),
 'theme':()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';try{localStorage.setItem('gleditech-theme',dark?'dark':'light')}catch(e){}const b=$('[data-act=theme]');if(b)b.innerHTML=I(dark?'sun':'moon')},
 'toast-close':b=>b.closest('.toast').remove(),
 'close-modal':()=>closeModal(),
 'search':()=>searchModal(),
 'notifications':async()=>{await updateNotifications();notificationsModal()},
 'read-notifications':async()=>{await api('/notifications/read',{method:'POST'});await updateNotifications();closeModal(true);toast('Notificaciones marcadas como leídas.')},
 'notification-go':b=>go(b.dataset.page),
 'profile':()=>profileModal(),
 'change-password':()=>passwordModal(false),
 'revoke-sessions':async()=>{await api('/auth/sessions',{method:'DELETE'});closeModal(true);toast('Se cerraron las otras sesiones.')},
 'logout':async()=>{if(S.page==='editor'&&S.dirty)await saveDoc(true);await api('/auth/logout',{method:'POST'});S.user=null;S.csrf='';S.edit=null;S.dirty=false;closeModal(true);history.replaceState(null,'',location.pathname);renderAuth('login')},
 'forgot-password':()=>renderAuth('forgot'),
 'back-login':()=>{history.replaceState(null,'','/');renderAuth('login')},
 'new-entity':b=>entityModal(b.dataset.entity),
 'edit-entity':b=>entityModal(b.dataset.entity,b.dataset.id),
 'delete-entity':async b=>{if(!confirm('¿Eliminar este registro? Los registros vinculados a proyectos o documentos no pueden eliminarse.'))return;await api('/'+b.dataset.entity+'/'+b.dataset.id,{method:'DELETE'});closeModal(true);await preload();if(S.page==='project')await go('projects');else await route();toast('Registro eliminado.')},
 'client-history':b=>clientHistory(b.dataset.id),
 'project-detail':b=>go('project',b.dataset.id),
 'category-filter':b=>{S.filter.category=b.dataset.category;S.filter.page=1;$$('[data-act=category-filter]').forEach(x=>x.classList.toggle('active',x===b));updateList()},
 'list-page':b=>{S.filter.page=+b.dataset.pageNumber;updateList()},
 'new-document':async b=>{await preload();await go('editor','new-'+b.dataset.kind)},
 'open-document':b=>go('editor',b.dataset.id),
 'save-document':async()=>{await saveDoc(true);await route();toast(window.GLEDITECH_DEMO?'Borrador de prueba en memoria. Se pierde al cerrar esta pestaña.':'Borrador guardado en el servidor.')},
 'manual-item':()=>{S.edit.data.items.push({id:uuid(),code:'',description:'',category:'Materiales',unit:'und',quantity:'1',price:'0',cost:'0',vat:S.company.default_vat});$('#editor-items').innerHTML=editorRows();markDoc();updateEditorTotals();$$('[data-item-field=description]').at(-1)?.focus()},
 'remove-item':b=>{S.edit.data.items.splice(+b.dataset.index,1);$('#editor-items').innerHTML=editorRows();markDoc();updateEditorTotals()},
 'pick-prices':()=>pricePicker(),
 'pick-photos':()=>photoPicker(),
 'issue-document':()=>issueDocument(),
 'duplicate-document':async b=>{if(S.page==='editor'&&S.dirty)await saveDoc(true);const r=await api('/documents/'+b.dataset.id+'/duplicate',{method:'POST'});S.edit=null;await go('editor',r.id);toast('Copia independiente creada.')},
 'convert-document':async b=>{if(S.dirty)await saveDoc(true);const r=await api('/documents/'+b.dataset.id+'/convert',{method:'POST'});S.edit=null;await go('editor',r.id);toast('Proforma preparada a partir del presupuesto.')},
 'delete-document':async b=>{if(!confirm('¿Eliminar este borrador?'))return;clearTimeout(S.timer);if(S.saving)await S.saving;await api('/documents/'+b.dataset.id,{method:'DELETE'});const page=S.edit?.kind==='quote'?'quotes':'budgets';S.dirty=false;S.edit=null;await go(page);toast('Borrador eliminado.')},
 'pdf-document':async b=>{if(S.page==='editor'&&S.dirty)await saveDoc(true);await download('/documents/'+b.dataset.id+'/pdf',(b.dataset.code||'GLEDITECH_Proforma')+'.pdf')},
 'print-document':async b=>{if(S.dirty)await saveDoc(true);if(window.GLEDITECH_DEMO)return toast('La vista PDF de impresión está disponible al ejecutar el servidor.',true);const id=b.dataset.id||S.edit?.id;if(!id)throw new Error('Guarda el documento antes de imprimir.');window.open('/api/documents/'+id+'/pdf?inline=true','_blank','noopener')},
 'email-document':b=>emailDocument(b.dataset.id),
 'document-status':b=>documentStatus(b.dataset.id),
 'download-draft':()=>{const blob=new Blob([JSON.stringify({format:'GLEDITECH_ERP_DRAFT',version:1,document:docPayload()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(S.edit.code||'Borrador')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);toast('Borrador descargado para conservar tus cambios. No es un respaldo completo del sistema.')},
 'project-budget':async b=>{const p=await api('/projects/'+b.dataset.id);S.edit={_key:'new-budget',id:null,kind:'budget',code:'Numeración automática',title:p.name,date:TODAY(),client_id:p.client_id||'',project_id:p.id,status:'Borrador',version:0,demo:!!p.demo,data:{items:[],discount:'0',notes:'',terms:S.company.terms||'',scope:p.notes||'',valid_days:S.company.valid_days,include_photos:true,photo_ids:[]},totals:{}};S.dirty=false;await go('editor','new-budget')},
 'project-files':b=>{S.photoProject=b.dataset.id;return go(b.dataset.target)},
 'project-costs':b=>costsModal(b.dataset.id),
 'new-expense':b=>expenseModal(b.dataset.project||S.projects[0]?.id||''),
 'delete-expense':async b=>{if(!confirm('¿Eliminar este costo registrado?'))return;await api('/expenses/'+b.dataset.id,{method:'DELETE'});await costsModal(b.dataset.project);toast('Costo eliminado.')},
 'price-history':b=>priceHistory(b.dataset.id),
 'export-prices':()=>download('/prices/export','GLEDITECH_Precios.xlsx'),
 'price-template':()=>download('/prices/export?template=true','GLEDITECH_Plantilla_Precios.xlsx'),
 'import-prices':()=>importPricesModal(),
 'bulk-prices':()=>bulkModal(),
 'new-apu':()=>apuModal(),
 'apu-manual':()=>{S.apuDraft.resources.push({id:uuid(),description:'',category:'material',unit:'und',mode:'consumption',quantity:'1',price:'0',waste:'0',base:'labor'});$('#apu-rows').innerHTML=apuRows();S.modalDirty=true;updateApuCalc()},
 'apu-remove':b=>{S.apuDraft.resources.splice(+b.dataset.index,1);$('#apu-rows').innerHTML=apuRows();S.modalDirty=true;updateApuCalc()},
 'apu-add-catalog':()=>{const p=S.prices.find(x=>x.id===$('#apu-resource-catalog').value);if(!p)return toast('Selecciona un recurso.',true);S.apuDraft.resources.push({id:uuid(),description:p.description,category:({'Materiales':'material','Mano de Obra':'labor','Equipos':'equipment','Transporte':'transport'})[p.category]||'material',unit:p.unit,mode:'consumption',quantity:'1',price:p.cost,waste:'0',base:'labor'});if(p.demo){const c=$('#dialog [name=demo]');if(c)c.checked=true}$('#apu-rows').innerHTML=apuRows();S.modalDirty=true;updateApuCalc()},
 'photo-stage':b=>{S.photoStage=b.dataset.stage;$$('[data-act=photo-stage]').forEach(x=>x.classList.toggle('active',x===b));$('#file-results').innerHTML=fileResults(S.page)},
 'upload-file':b=>uploadModal(b.dataset.purpose||'photo'),
 'view-photo':b=>{const f=S.files.find(x=>x.id===b.dataset.id);modal(E(f?.caption||f?.name||'Fotografía'),(f?.stage||'')+' · '+(f?.project_name||''),`<img class="photo-preview" src="${fileURL(b.dataset.id)}" alt="${E(f?.caption||'Fotografía de obra')}">`,{wide:true,footer:B('Descargar','download-file','download','primary sm',`data-id="${b.dataset.id}" data-name="${E(f?.name||'Fotografía.jpg')}"`)})},
 'download-file':b=>download('/files/'+b.dataset.id+'/content',b.dataset.name||'Archivo'),
 'delete-file':async b=>{if(!confirm('¿Eliminar este archivo del expediente? Los archivos utilizados en documentos emitidos están protegidos.'))return;await api('/files/'+b.dataset.id,{method:'DELETE'});await route();toast('Archivo retirado del expediente.')},
 'print-report':()=>window.print(),
 'export-report':()=>download('/reports/export?start='+S.reportStart+'&end='+S.reportEnd,'GLEDITECH_Reporte_Costos.xlsx'),
 'new-user':()=>userModal(),
 'edit-user':b=>userModal(b.dataset.id),
 'audit-prev':()=>{S.auditOffset=Math.max(0,S.auditOffset-100);return route()},
 'audit-next':()=>{if(S.audit.length===100){S.auditOffset+=100;return route()}},
 'backup':async()=>{const r=await api('/backups',{method:'POST'});await download('/backups/'+r.name,r.name);toast('Respaldo completo generado. Conserva el ZIP en un lugar seguro.');if(S.page==='settings')await route()},
 'download-backup':b=>download('/backups/'+b.dataset.name,b.dataset.name),
 'legacy-import':()=>legacyModal(),
 'clear-demo':async()=>{const confirmation=prompt('Esta operación elimina solo registros de ejemplo. Escribe ELIMINAR EJEMPLOS para confirmar.');if(confirmation!=='ELIMINAR EJEMPLOS')return;await api('/demo',{method:'DELETE',body:{confirm:confirmation}});await preload();await route();toast('Se eliminaron los registros de demostración.')},
 'search-open':async b=>{const {type,id}=b.dataset;closeModal(true);if(type==='projects')return go('project',id);if(type==='clients')return clientHistory(id);if(type==='documents')return go('editor',id);if(type==='prices'){if(isAdmin())return entityModal('prices',id);await go('prices');S.filter.q=S.prices.find(x=>x.id===id)?.code||'';$('#list-search').value=S.filter.q;updateList()}}
};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();if(b.disabled)return;try{await actions[b.dataset.act]?.(b)}catch(error){console.error(error);toast(error.message,true)}});
document.addEventListener('submit',async e=>{
 e.preventDefault();const form=e.target;if(!form.reportValidity())return;const button=form.querySelector('button[type=submit]');if(button?.disabled)return;if(button)button.disabled=true;
 try{
  if(form.id==='dialog-form'&&S.modalSubmit){await S.modalSubmit(form)}
  else if(form.id==='auth-form'){
   const v=formValues(form),mode=form.dataset.mode;$('#form-error').hidden=true;
   if(mode==='login'){const r=await api('/auth/login',{method:'POST',body:v});S.user=r.user;S.csrf=r.csrf;if(S.user.must_change){passwordModal(true)}else{await preload();if(!location.hash||location.hash.startsWith('#token='))history.replaceState(null,'','#dashboard');await route()}}
   else if(mode==='forgot'){const r=await api('/auth/forgot',{method:'POST',body:v});$('#form-error').className='notice blue';$('#form-error').textContent=r.message;$('#form-error').hidden=false}
   else{if(v.new_password!==v.confirm_password)throw new Error('Las contraseñas no coinciden.');await api('/auth/reset',{method:'POST',body:{token:S.resetToken,new_password:v.new_password}});history.replaceState(null,'','/');renderAuth('login');toast('Contraseña actualizada. Inicia sesión con tu nueva clave.')}
  }else if(form.id==='company-form'){S.company=await api('/company',{method:'PUT',body:{...S.company,...formValues(form)}});await route();toast('Configuración guardada. Los documentos emitidos se conservan.')}
  else if(form.id==='report-filter'){const v=formValues(form);S.reportStart=v.start;S.reportEnd=v.end;await route()}
 }catch(error){console.error(error);if(form.id==='dialog-form'||form.id==='auth-form')formError(error.message);else toast(error.message,true)}
 finally{if(button?.isConnected)button.disabled=false}
});
let queryTimer,auditTimer;
document.addEventListener('input',e=>{const t=e.target;if(t.closest('#dialog'))S.modalDirty=true;
 if(t.id==='list-search'){S.filter.q=t.value;S.filter.page=1;updateList()}
 if(t.id==='file-search')$('#file-results').innerHTML=fileResults(S.page,t.value);
 if(t.id==='price-picker-search'){$('#price-picker-list').innerHTML=pricePickerRows(t.value);S.modalDirty=false}
 if(t.id==='global-query'){clearTimeout(queryTimer);const value=t.value;queryTimer=setTimeout(async()=>{try{const r=await api('/search?q='+encodeURIComponent(value));if(!$('#global-results')||$('#global-query').value!==value)return;$('#global-results').innerHTML=r.length?r.map(x=>`<button class="search-result" data-act="search-open" data-id="${x.id}" data-type="${x.type}">${I(x.type==='projects'?'folder':x.type==='clients'?'users':x.type==='prices'?'calculator':'file')}<span class="grow"><strong>${E(x.title)}</strong><small>${E(x.label)}</small></span>${I('arrow','sm')}</button>`).join(''):empty(value.length<2?'Escribe un poco más':'No hay coincidencias','Busca por nombre o descripción.')}catch(e){toast(e.message,true)}},250);S.modalDirty=false}
 if(t.id==='audit-search'){clearTimeout(auditTimer);auditTimer=setTimeout(async()=>{try{S.audit=await api('/audit?q='+encodeURIComponent(t.value));if($('#audit-results'))$('#audit-results').innerHTML=auditRows()}catch(e){toast(e.message,true)}},300)}
 if(t.matches('select,input[type=checkbox]'))return;
 if(t.dataset.doc&&canEditDoc()){S.edit[t.dataset.doc]=t.value;markDoc()}
 if(t.dataset.docField&&canEditDoc()){S.edit.data[t.dataset.docField]=t.value;markDoc();updateEditorTotals()}
 if(t.dataset.itemField&&canEditDoc()){S.edit.data.items[+t.dataset.item][t.dataset.itemField]=t.value;markDoc();updateEditorTotals()}
 if(t.dataset.apuField){S.apuDraft[t.dataset.apuField]=t.value;updateApuCalc()}
 if(t.dataset.apuResource){S.apuDraft.resources[+t.dataset.apuRow][t.dataset.apuResource]=t.value;updateApuCalc()}
 if(['price','quantity','vat'].includes(t.name)&&$('#f-computed_total')){$('#f-computed_total').value=money(Number($('#f-price').value)*Number($('#f-quantity').value)*(1+Number($('#f-vat').value)/100))}
});
document.addEventListener('change',async e=>{const t=e.target;try{
 if(t.id==='status-filter'){S.filter.status=t.value;S.filter.page=1;updateList()}
 if(t.id==='file-project-filter'){S.photoProject=t.value;$('#file-results').innerHTML=fileResults(S.page)}
 if(t.id==='price-import-file'){S.importConfirmed=false;S.importFile=null;$('#import-review').innerHTML='';$('#dialog-form button[type=submit]').textContent='Revisar archivo'}
 if(t.dataset.priceChoice){t.checked?S.pickerSelected.add(t.dataset.priceChoice):S.pickerSelected.delete(t.dataset.priceChoice)}
 if(t.dataset.doc&&canEditDoc()&&t.matches('select,input[type=checkbox]')){
  const key=t.dataset.doc;S.edit[key]=t.type==='checkbox'?t.checked:t.value;
  if(key==='client_id'){
   const current=S.projects.find(x=>x.id===S.edit.project_id);if(current?.client_id&&current.client_id!==t.value){S.edit.project_id='';S.edit.data.photo_ids=[]}
   $('#f-project_id').innerHTML=opts([['','Sin proyecto asociado'],...S.projects.filter(p=>!t.value||!p.client_id||p.client_id===t.value).map(p=>[p.id,p.name])],S.edit.project_id);
   if(S.clients.find(c=>c.id===t.value)?.demo){S.edit.demo=true;const box=$('[data-doc=demo]');if(box)box.checked=true}
  }
  if(key==='project_id'){
   const p=S.projects.find(p=>p.id===t.value);if(p?.client_id){S.edit.client_id=p.client_id;$('#f-client_id').value=p.client_id}if(p?.demo){S.edit.demo=true;const box=$('[data-doc=demo]');if(box)box.checked=true}
   const photos=t.value?await api('/files?purpose=photo&project_id='+t.value):[];S.edit.data.photo_ids=photos.slice(0,30).map(x=>x.id);
  }
  if($('#editor-photos'))$('#editor-photos').innerHTML=editorPhotos();markDoc();
 }
 if(t.dataset.docField&&canEditDoc()&&t.type==='checkbox'){S.edit.data[t.dataset.docField]=t.checked;markDoc()}
 if(t.dataset.itemField&&canEditDoc()&&t.tagName==='SELECT'){S.edit.data.items[+t.dataset.item][t.dataset.itemField]=t.value;markDoc();updateEditorTotals()}
 if(t.dataset.apuField&&t.tagName==='SELECT'){S.apuDraft[t.dataset.apuField]=t.value;updateApuCalc()}
 if(t.dataset.apuResource&&t.tagName==='SELECT'){
  const r=S.apuDraft.resources[+t.dataset.apuRow];r[t.dataset.apuResource]=t.value;
  if(r.category!=='equipment'&&r.mode==='percent'){r.mode='consumption';r.unit='und'}
  if(t.dataset.apuResource==='mode'&&r.mode==='crew')r.unit='h';if(r.mode==='percent'){r.unit='%';r.waste='0'}
  $('#apu-rows').innerHTML=apuRows();updateApuCalc();
 }
 }catch(error){toast(error.message,true)}});
$('#dialog').addEventListener('cancel',e=>{if(S.user?.must_change){e.preventDefault();return}if(S.modalDirty&&!confirm('Hay cambios sin guardar. ¿Descartarlos?'))e.preventDefault();else{S.modalDirty=false;S.modalSubmit=null}});
document.addEventListener('keydown',e=>{if(!S.user||S.user.must_change)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&S.page==='editor'){e.preventDefault();saveDoc(true).then(()=>toast('Documento guardado.')).catch(e=>toast(e.message,true))}if(e.key==='Escape')document.body.classList.remove('menu-open')});
window.addEventListener('hashchange',()=>{if(S.user&&!S.user.must_change)route()});
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});
setInterval(async()=>{if(!S.user||S.user.must_change||document.hidden||$('#dialog').open)return;try{await updateNotifications();if(S.page==='dashboard'){const d=await api('/dashboard');if(S.page==='dashboard'&&!$('#dialog').open){const banner=window.GLEDITECH_DEMO?'<div class="demo-banner">'+I('info')+'Vista previa sin servidor. Cambios temporales; no uses datos reales. El sistema completo está en el ZIP.</div>':'';$('#main').innerHTML=banner+renderDashboard(d)+footer()}}}catch(e){console.warn('Refresh unavailable:',e.message)}},30000);
async function boot(){try{document.documentElement.dataset.theme=localStorage.getItem('gleditech-theme')||'light'}catch(e){}
 const token=location.hash.match(/^#token=(.+)$/);if(location.pathname==='/reset-password'&&token){S.resetToken=decodeURIComponent(token[1]);history.replaceState(null,'','/reset-password');renderAuth('reset');return}
 try{const r=await api('/auth/me');S.user=r.user;S.csrf=r.csrf;if(S.user.must_change){renderAuth('login');passwordModal(true);return}await preload();await route()}
 catch(e){if(e.status===401)renderAuth('login');else{$('#app').innerHTML=`<div class="boot"><img src="${asset('logo.png')}" alt="GLEDITECH"><h1>No se pudo conectar con el servidor.</h1><p>${E(e.message)}</p><p>Revisa el estado del servicio en Render y su conexión a PostgreSQL.</p></div>`}}
}
boot();
</script></body></html>
