databases:
  - name: gleditech-db
    databaseName: gleditech
    plan: 0.1c-256mb
    user: gleditech
services:
  - type: web
    name: gleditech
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gleditech-db
          property: connectionString
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_NAME
        value: Administrador
